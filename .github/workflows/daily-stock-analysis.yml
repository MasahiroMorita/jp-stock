name: Daily Stock Screener & Analysis

on:
  schedule:
    # 平日 17:00 JST (= 08:00 UTC)。JST は夏時間がないため固定で問題ない
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "実行モード"
        type: choice
        options:
          - screener-and-analyze
          - analyze-only
        default: screener-and-analyze
      max_stocks:
        description: "分析する最大銘柄数"
        type: string
        default: "30"

# 前回の実行が残っていれば重複起動しない
concurrency:
  group: daily-stock-analysis
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # Kimi Code CLI の自動アップデート・テレメトリを無効化
  KIMI_CODE_NO_AUTO_UPDATE: "1"
  KIMI_DISABLE_TELEMETRY: "1"

jobs:
  screen-and-analyze:
    runs-on: ubuntu-latest
    # Secrets/Variables は "Github Actions" Environment に登録されているため参照必須
    environment: Github Actions
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # 株探 業種別ランキングのキャッシュを前回実行分から復元する。
      # ファイル内の日付が当日ならそのまま使い回し、前日分でも株探からの
      # 取得失敗(405)時のフォールバックとして使われる（actions/cache がジョブ終了時に自動保存）。
      - name: Cache kabutan industry ranking
        uses: actions/cache@v4
        with:
          path: kabutan_industry_ranking.json
          key: kabutan-industry-ranking-${{ github.run_id }}
          restore-keys: kabutan-industry-ranking-

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Kimi Code CLI
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"

      # CIランナーの外部通信をすべて VPN Gate の日本リレー経由にする。
      # 株探(kabutan.jp)はデータセンターIPをWAFで拒否(HTTP 405)するため、
      # 日本のISP/家庭用IPから egress されるリレー経由でブロックを回避する。
      # 注意: このステップ以降、Notion/Kimi の API 通信を含む外部通信はすべて
      # リレーを通る。リレーがダウンしている場合はスコア順に最大10台まで試行し、
      # すべて失敗したらジョブを失敗させる。
      - name: Route all traffic via VPN Gate Japan relay
        run: sudo bash ci/setup-vpn-gate.sh

      # analyze-only モードではスクリーナーをスキップし、リポジトリに登録済みの
      # テスト用フィクスチャCSV (test/fixtures/pullback_buy_signals.csv) を使って analyze を検証する
      - name: Run stock-screener
        if: github.event.inputs.run_mode != 'analyze-only'
        run: python stock-screener.py

      - name: Upload screener results
        if: always() && github.event.inputs.run_mode != 'analyze-only'
        uses: actions/upload-artifact@v4
        with:
          name: pullback_buy_signals
          path: pullback_buy_signals.csv
          if-no-files-found: ignore

      - name: Run stock-analyze (STRONG_BUY / BUY)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # データベースIDは資格情報ではないため Variable で管理
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          # Kimi Platform の API キー認証（config.toml 不要の env ベース認証）
          KIMI_MODEL_NAME: ${{ vars.KIMI_MODEL_NAME }}
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_API_KEY }}
          # analyze-only モードではスクリーナ出力の代わりにフィクスチャCSVを使う
          SIGNALS_CSV: ${{ github.event.inputs.run_mode == 'analyze-only' && 'test/fixtures/pullback_buy_signals.csv' || 'pullback_buy_signals.csv' }}
          MAX_ANALYZE_STOCKS: ${{ github.event.inputs.max_stocks || '30' }}
        run: python analyze_signals.py
